services:
  - type: web
    name: math-web-api-tralalerotralala2011
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: MATH_WEB_SECRET_KEY
        generateValue: true
