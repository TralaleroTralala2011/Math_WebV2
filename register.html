<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký | MATHWEB</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/log-regist.css">
<link rel="stylesheet" href="css/mobile-responsive.css">
<script src="js/session-navigation-guard.js" defer></script><link rel="stylesheet" href="css/neon-v5.css?v=5" /><link rel="stylesheet" href="css/neon-v6.css?v=6" /><link rel="stylesheet" href="css/neon-v7.css?v=7"><link rel="stylesheet" href="css/neon-v8.css?v=8"><link rel="stylesheet" href="css/sortlab-visual-only-v32.css?v=32">
<link rel="stylesheet" href="css/v42-shared-navbar-flush.css?v=42">
<link rel="stylesheet" href="css/mw-v43-reference-nav.css?v=43">
<link rel="stylesheet" href="css/logout-confirm-v43.css?v=43">
</script><link rel="stylesheet" href="css/unified-navbar-v56.css?v=56"><script src="js/unified-navbar-v56.js?v=56"></script></head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <a href="index.html" class="logo">

            <span class="logo-icon">
                ∑
            </span>

            <span class="logo-text">
                MATH<span>WEB</span>
            </span>

        </a>


        <nav class="nav-menu">

            <a
                href="index.html"
                class="nav-link"
            >
                Trang chủ
            </a>

            <a
                href="practise.html"
                class="nav-link protected-practice-link"
            >
                Luyện tập
            </a>

            <a
                href="login.html"
                class="nav-link"
                id="loginNavLink"
            >
                Đăng nhập
            </a>

            <a
                href="register.html"
                class="nav-button active"
                id="registerNavLink"
            >
                Đăng ký
            </a>


            <div class="notification-wrapper">

                <button
                    id="notificationButton"
                    class="notification-button"
                    type="button"
                    aria-label="Thông báo"
                >
                    🔔

                    <span
                        id="notificationBadge"
                        class="notification-badge"
                    ></span>
                </button>


                <div
                    id="notificationPanel"
                    class="notification-panel"
                >

                    <div class="notification-header">

                        <div class="notification-title">
                            Thông báo
                        </div>

                        <button
                            id="readAllNotifications"
                            class="notification-read-all"
                            type="button"
                        >
                            Đọc tất cả
                        </button>

                    </div>


                    <div
                        id="notificationList"
                        class="notification-list"
                    ></div>

                </div>

            </div>

        </nav>


        <button
            class="mobile-menu-button"
            id="mobileMenuButton"
            type="button"
        >
            ☰
        </button>

    </header>


    <!-- REGISTER -->
    <main class="register-page">

        <section class="register-card">

            <a
                href="index.html"
                class="register-close"
                aria-label="Đóng"
            >
                ×
            </a>


            <div class="register-header">

                <h1>Đăng ký</h1>

                <p>
                    Tạo tài khoản và bắt đầu học toán
                </p>

            </div>


            <form
                id="registerForm"
                class="register-form"
            >

                <div class="form-group">

                    <label for="registerUsername">
                        Tên tài khoản
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        name="username"
                        placeholder="Nhập tên tài khoản"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Mật khẩu
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Nhập mật khẩu"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerConfirmPassword">
                        Nhập lại mật khẩu
                    </label>

                    <input
                        type="password"
                        id="registerConfirmPassword"
                        name="confirmPassword"
                        placeholder="Nhập lại mật khẩu"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div id="authMessage"></div>


                <button
                    type="submit"
                    class="register-submit"
                >
                    Tạo tài khoản
                </button>

            </form>


            <div class="register-footer">

                Đã có tài khoản?

                <a href="login.html">
                    Đăng nhập
                </a>

            </div>

        </section>

    </main>


    <script src="js/api-config.js"></script>
<script src="js/main.js"></script>
    <script src="js/notification.js"></script>
    <script src="js/auth.js"></script>

<footer class="mathweb-project-footer" style="position:relative;z-index:1;text-align:center;padding:18px 12px;background:#f5f3ff;color:#564675;font:12px/1.5 system-ui,sans-serif">Sản phẩm khoa học kỹ thuật của Lê Đức Nhân và Ngô Phúc Huy. Giáo viên hướng dẫn là GV.Khánh Hòa</footer><script src="js/neon-v5.js?v=5" defer></script><script src="js/optional-api-v33.js?v=35"></script>
<script src="js/neon-v6-experience.js?v=6" defer></script><script defer src="js/neon-v7-experience.js?v=7"></script><script src="js/sortlab-visual-only-v32.js?v=32" defer></script>
<script src="js/logout-confirm-v43.js?v=43"></script>
</body>
</html>
